<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Vowena Site. The marketing surface for the Vowena protocol.">
  <title>Vowena Site</title>
  <desc>Marketing site for the Vowena protocol. Next.js 16, Tailwind CSS, MDX-powered blog.</desc>

  <defs>
    <!-- Background gradient: matches protocol banner for brand cohesion -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F16"/>
      <stop offset="55%" stop-color="#160F3A"/>
      <stop offset="100%" stop-color="#1A0F52"/>
    </linearGradient>

    <!-- Soft violet glow behind the loop symbol -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6B4EFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6B4EFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6B4EFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass panel surface for stacked browser windows -->
    <linearGradient id="panelSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1A3A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14102A" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4EFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3F24C7" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="panelHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1A8A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1A0F52" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 24px dot grid (matches protocol banner) -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.045"/>
    </pattern>

    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Soft drop for the floating browser stack -->
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip mask to keep the panel stack inside its frame -->
    <clipPath id="panelClipFront">
      <rect x="0" y="0" width="360" height="200" rx="10"/>
    </clipPath>
  </defs>

  <!-- Base layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#vignette)"/>

  <!-- Hairline border (top + bottom) for protocol-grade feel -->
  <line x1="0" y1="0.5" x2="1280" y2="0.5" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <line x1="0" y1="319.5" x2="1280" y2="319.5" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- Soft accent glow behind the symbol -->
  <circle cx="170" cy="160" r="180" fill="url(#glow)"/>

  <!-- Logo: flowing loop, scaled 2x from the canonical 80-unit viewBox -->
  <g transform="translate(90 80) scale(2)">
    <path d="M44 18C44 18 28 22 24 40C20 58 36 62 36 62" stroke="#6B4EFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M36 62C36 62 52 58 56 40C60 22 44 18 44 18" stroke="#6B4EFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <circle cx="40" cy="40" r="3" fill="#6B4EFF"/>
  </g>

  <!-- Wordmark + meta -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'DM Sans', sans-serif">
    <!-- SITE eyebrow label -->
    <text x="288" y="138"
          font-size="11"
          font-weight="600"
          fill="#B5A8FF"
          letter-spacing="2"
          text-rendering="geometricPrecision">SITE</text>

    <!-- vowena wordmark -->
    <text x="286" y="200"
          font-size="84"
          font-weight="600"
          fill="#F4F4F5"
          letter-spacing="-2.5"
          text-rendering="geometricPrecision">vowena</text>

    <!-- Tagline -->
    <text x="289" y="238"
          font-size="17"
          font-weight="400"
          fill="#B0ADBF"
          letter-spacing="-0.2"
          text-rendering="geometricPrecision">The marketing surface for the Vowena protocol.</text>

    <!-- Footer meta row: monospace, far-left -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Space Mono', monospace"
       font-size="11"
       fill="#807C90"
       letter-spacing="0.6">
      <text x="288" y="272">NEXT.JS 16  ·  TAILWIND v4  ·  MDX  ·  APACHE 2.0</text>
    </g>
  </g>

  <!-- Right-side decoration: editorial stacked browser panels -->
  <!-- Suggests landing page, pricing, blog post -->
  <g transform="translate(870 60)" filter="url(#panelShadow)">

    <!-- Back panel (faintest, deepest in stack) -->
    <g transform="translate(60 30)" opacity="0.55">
      <rect width="320" height="170" rx="10" fill="url(#panelSurface)" stroke="url(#panelStroke)" stroke-width="1"/>
      <!-- Browser chrome dots -->
      <circle cx="16" cy="16" r="3" fill="#3F24C7" opacity="0.6"/>
      <circle cx="28" cy="16" r="3" fill="#3F24C7" opacity="0.6"/>
      <circle cx="40" cy="16" r="3" fill="#3F24C7" opacity="0.6"/>
      <line x1="0" y1="32" x2="320" y2="32" stroke="#23223A" stroke-opacity="0.7"/>
      <!-- Faint content lines suggesting a blog list -->
      <rect x="20" y="50" width="120" height="6" rx="2" fill="#6B4EFF" opacity="0.35"/>
      <rect x="20" y="66" width="200" height="4" rx="2" fill="#807C90" opacity="0.35"/>
      <rect x="20" y="76" width="170" height="4" rx="2" fill="#807C90" opacity="0.25"/>
      <line x1="20" y1="98" x2="300" y2="98" stroke="#23223A" stroke-opacity="0.7"/>
      <rect x="20" y="112" width="100" height="5" rx="2" fill="#807C90" opacity="0.3"/>
      <rect x="20" y="124" width="180" height="3" rx="2" fill="#807C90" opacity="0.2"/>
      <rect x="20" y="132" width="150" height="3" rx="2" fill="#807C90" opacity="0.2"/>
    </g>

    <!-- Middle panel (pricing card vibe) -->
    <g transform="translate(30 60)" opacity="0.85">
      <rect width="340" height="180" rx="10" fill="url(#panelSurface)" stroke="url(#panelStroke)" stroke-width="1"/>
      <!-- Browser chrome dots -->
      <circle cx="16" cy="16" r="3.5" fill="#6B4EFF" opacity="0.7"/>
      <circle cx="30" cy="16" r="3.5" fill="#6B4EFF" opacity="0.45"/>
      <circle cx="44" cy="16" r="3.5" fill="#6B4EFF" opacity="0.3"/>
      <line x1="0" y1="34" x2="340" y2="34" stroke="#23223A" stroke-opacity="0.8"/>

      <!-- Three pricing columns -->
      <g transform="translate(20 50)">
        <!-- Column 1 -->
        <rect width="92" height="118" rx="6" fill="#0F0F16" fill-opacity="0.6" stroke="#23223A"/>
        <rect x="12" y="14" width="40" height="5" rx="2" fill="#807C90" opacity="0.7"/>
        <rect x="12" y="30" width="56" height="9" rx="2" fill="#F4F4F5" opacity="0.85"/>
        <line x1="12" y1="52" x2="80" y2="52" stroke="#23223A"/>
        <rect x="12" y="62" width="64" height="3" rx="1" fill="#807C90" opacity="0.45"/>
        <rect x="12" y="72" width="50" height="3" rx="1" fill="#807C90" opacity="0.45"/>
        <rect x="12" y="82" width="60" height="3" rx="1" fill="#807C90" opacity="0.45"/>
        <rect x="12" y="98" width="68" height="10" rx="3" fill="#6B4EFF" opacity="0.25"/>

        <!-- Column 2 (highlighted) -->
        <g transform="translate(102 0)">
          <rect width="92" height="118" rx="6" fill="#1A0F52" fill-opacity="0.85" stroke="#6B4EFF" stroke-opacity="0.55"/>
          <rect x="12" y="14" width="40" height="5" rx="2" fill="#B5A8FF" opacity="0.85"/>
          <rect x="12" y="30" width="56" height="9" rx="2" fill="#F4F4F5"/>
          <line x1="12" y1="52" x2="80" y2="52" stroke="#3F24C7" stroke-opacity="0.6"/>
          <rect x="12" y="62" width="64" height="3" rx="1" fill="#B5A8FF" opacity="0.55"/>
          <rect x="12" y="72" width="50" height="3" rx="1" fill="#B5A8FF" opacity="0.55"/>
          <rect x="12" y="82" width="60" height="3" rx="1" fill="#B5A8FF" opacity="0.55"/>
          <rect x="12" y="98" width="68" height="10" rx="3" fill="#6B4EFF" opacity="0.85"/>
        </g>

        <!-- Column 3 -->
        <g transform="translate(204 0)">
          <rect width="92" height="118" rx="6" fill="#0F0F16" fill-opacity="0.6" stroke="#23223A"/>
          <rect x="12" y="14" width="40" height="5" rx="2" fill="#807C90" opacity="0.7"/>
          <rect x="12" y="30" width="56" height="9" rx="2" fill="#F4F4F5" opacity="0.85"/>
          <line x1="12" y1="52" x2="80" y2="52" stroke="#23223A"/>
          <rect x="12" y="62" width="64" height="3" rx="1" fill="#807C90" opacity="0.45"/>
          <rect x="12" y="72" width="50" height="3" rx="1" fill="#807C90" opacity="0.45"/>
          <rect x="12" y="82" width="60" height="3" rx="1" fill="#807C90" opacity="0.45"/>
          <rect x="12" y="98" width="68" height="10" rx="3" fill="#6B4EFF" opacity="0.25"/>
        </g>
      </g>
    </g>

    <!-- Front panel (landing hero) -->
    <g transform="translate(0 110)">
      <rect width="360" height="200" rx="10" fill="url(#panelSurface)" stroke="url(#panelStroke)" stroke-width="1"/>
      <g clip-path="url(#panelClipFront)">
        <!-- Browser chrome -->
        <rect width="360" height="36" fill="#0F0F16" fill-opacity="0.7"/>
        <circle cx="16" cy="18" r="3.5" fill="#6B4EFF"/>
        <circle cx="30" cy="18" r="3.5" fill="#6B4EFF" opacity="0.6"/>
        <circle cx="44" cy="18" r="3.5" fill="#6B4EFF" opacity="0.4"/>
        <!-- URL bar -->
        <rect x="80" y="10" width="200" height="16" rx="8" fill="#1F1A3A" stroke="#23223A"/>
        <rect x="92" y="16" width="80" height="4" rx="2" fill="#807C90" opacity="0.7"/>
        <line x1="0" y1="36" x2="360" y2="36" stroke="#23223A" stroke-opacity="0.9"/>

        <!-- Hero content area -->
        <rect x="0" y="36" width="360" height="164" fill="url(#panelHero)"/>

        <!-- Mini eyebrow tag -->
        <rect x="24" y="60" width="60" height="14" rx="7" fill="#6B4EFF" fill-opacity="0.2" stroke="#6B4EFF" stroke-opacity="0.45"/>
        <rect x="32" y="66" width="44" height="3" rx="1.5" fill="#B5A8FF"/>

        <!-- Hero headline (3 lines, bold) -->
        <rect x="24" y="88" width="240" height="9" rx="2.5" fill="#F4F4F5"/>
        <rect x="24" y="104" width="280" height="9" rx="2.5" fill="#F4F4F5"/>
        <rect x="24" y="120" width="180" height="9" rx="2.5" fill="#F4F4F5" opacity="0.6"/>

        <!-- Subhead -->
        <rect x="24" y="140" width="220" height="4" rx="2" fill="#B0ADBF" opacity="0.5"/>
        <rect x="24" y="150" width="180" height="4" rx="2" fill="#B0ADBF" opacity="0.5"/>

        <!-- CTA buttons -->
        <rect x="24" y="170" width="86" height="22" rx="6" fill="#6B4EFF"/>
        <rect x="40" y="178" width="54" height="6" rx="2" fill="#FFFFFF" opacity="0.95"/>

        <rect x="118" y="170" width="86" height="22" rx="6" fill="none" stroke="#23223A"/>
        <rect x="134" y="178" width="54" height="6" rx="2" fill="#B0ADBF" opacity="0.7"/>
      </g>
    </g>

  </g>

  <!-- Tiny meta corner: inert URL chip, top-right, monospace -->
  <g transform="translate(1248 28)" text-anchor="end"
     font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
     font-size="10" fill="#807C90" letter-spacing="0.5">
    <text>vowena.xyz</text>
  </g>
  <circle cx="1226" cy="24" r="2.5" fill="#00DC82" opacity="0.85"/>
</svg>
